<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>
<title>Crop Profile Photo</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    overscroll-behavior: none;
    touch-action: none;

    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    align-items: center;

    overscroll-behavior: none;
    touch-action: none;
}

#title {
    width: 100%;
    padding:
        12px
        16px
        8px;

    font-size: 18px;
    font-weight: 600;
}

#cropArea {
    position: relative;

    width: min(
        100vw,
        100vh - 120px
    );

    height: min(
        100vw,
        100vh - 120px
    );

    max-width: 800px;
    max-height: 800px;

    overflow: hidden;

    background: #000;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;
}

#canvas {
    display: block;

    width: 100%;
    height: 100%;

    touch-action: none;
}

#hint {
    width: 100%;
    padding:
        8px
        16px;

    text-align: center;

    font-size: 14px;

    opacity: .7;
}

#buttons {
    width: 100%;

    display: flex;

    gap: 10px;

    padding:
        10px
        16px
        calc(
            10px +
            env(safe-area-inset-bottom)
        );
}

button {
    flex: 1;

    min-height: 46px;

    border: 0;
    border-radius: 10px;

    background:
        var(
            --tg-theme-secondary-bg-color,
            #eeeeee
        );

    color:
        var(
            --tg-theme-text-color,
            #000000
        );

    font-size: 16px;
    font-weight: 600;
}

#apply {
    background:
        var(
            --tg-theme-button-color,
            #2481cc
        );

    color:
        var(
            --tg-theme-button-text-color,
            #ffffff
        );
}

button:disabled {
    opacity: .5;
}

#loading {
    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        var(
            --tg-theme-bg-color,
            #ffffff
        );

    z-index: 10;
}

#loading.hidden {
    display: none;
}

#status {
    padding: 16px;

    text-align: center;

    font-size: 16px;
}
</style>
</head>

<body>

<div id="loading">
    <div id="status">
        Loading image…
    </div>
</div>

<div id="title">
    Position Profile Photo
</div>

<div id="cropArea">
    <canvas id="canvas"></canvas>
</div>

<div id="hint">
    Drag to position · Pinch or scroll to zoom
</div>

<div id="buttons">
    <button id="cancel">
        Cancel
    </button>

    <button id="apply">
        Apply
    </button>
</div>

<script>
const tg =
    window.Telegram &&
    window.Telegram.WebApp;

if (!tg) {
    document.getElementById(
        "status"
    ).textContent =
        "This page must be opened inside Telegram.";

    throw new Error(
        "Telegram WebApp unavailable."
    );
}

tg.ready();
tg.expand();

if (
    typeof tg.disableVerticalSwipes ===
    "function"
) {
    tg.disableVerticalSwipes();
}

const params =
    new URLSearchParams(
        location.search
    );

const session =
    params.get("session") ||
    params.get("tgWebAppStartParam") ||
    tg.initDataUnsafe?.start_param ||
    "";

const cropArea =
    document.getElementById(
        "cropArea"
    );

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha: false
        }
    );

const loading =
    document.getElementById(
        "loading"
    );

const status =
    document.getElementById(
        "status"
    );

const applyButton =
    document.getElementById(
        "apply"
    );

const cancelButton =
    document.getElementById(
        "cancel"
    );

if (!session) {
    status.textContent =
        "The crop session is missing.";

    throw new Error(
        "Missing session."
    );
}

let image =
    new Image();

let imageLoaded =
    false;

let imageWidth =
    0;

let imageHeight =
    0;

let scale =
    1;

let minScale =
    1;

let centerX =
    0;

let centerY =
    0;

let dragging =
    false;

let lastX =
    0;

let lastY =
    0;

let pinchStartDistance =
    0;

let pinchStartScale =
    1;

let pinchCenterX =
    0;

let pinchCenterY =
    0;

let pointers =
    new Map();

function setStatus(text) {
    status.textContent =
        text;
}

function resizeCanvas() {
    const rect =
        cropArea.getBoundingClientRect();

    const size =
        Math.max(
            1,
            Math.round(
                rect.width *
                devicePixelRatio
            )
        );

    canvas.width =
        size;

    canvas.height =
        size;

    draw();
}

function calculateMinimumScale() {
    const largestDimension =
        Math.max(
            imageWidth,
            imageHeight
        );

    minScale =
        Math.max(
            canvas.width /
                imageWidth,
            canvas.height /
                imageHeight
        );
}

function clampCenter() {
    const visibleWidth =
        canvas.width / scale;

    const visibleHeight =
        canvas.height / scale;

    const halfVisibleWidth =
        visibleWidth / 2;

    const halfVisibleHeight =
        visibleHeight / 2;

    const minCenterX =
        halfVisibleWidth;

    const maxCenterX =
        imageWidth -
        halfVisibleWidth;

    const minCenterY =
        halfVisibleHeight;

    const maxCenterY =
        imageHeight -
        halfVisibleHeight;

    if (
        visibleWidth >=
        imageWidth
    ) {
        centerX =
            imageWidth / 2;
    } else {
        centerX =
            Math.max(
                minCenterX,
                Math.min(
                    centerX,
                    maxCenterX
                )
            );
    }

    if (
        visibleHeight >=
        imageHeight
    ) {
        centerY =
            imageHeight / 2;
    } else {
        centerY =
            Math.max(
                minCenterY,
                Math.min(
                    centerY,
                    maxCenterY
                )
            );
    }
}

function draw() {
    if (!imageLoaded) {
        return;
    }

    const size =
        canvas.width;

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        size,
        size
    );

    const sourceWidth =
        size / scale;

    const sourceHeight =
        size / scale;

    const sx =
        centerX -
        sourceWidth / 2;

    const sy =
        centerY -
        sourceHeight / 2;

    ctx.drawImage(
        image,
        sx,
        sy,
        sourceWidth,
        sourceHeight,
        0,
        0,
        size,
        size
    );
}

function setZoom(
    newScale,
    focalX,
    focalY
) {
    newScale =
        Math.max(
            minScale,
            Math.min(
                minScale * 8,
                newScale
            )
        );

    const oldScale =
        scale;

    if (
        newScale === oldScale
    ) {
        return;
    }

    const imagePointX =
        centerX +
        (
            focalX -
            canvas.width / 2
        ) /
        oldScale;

    const imagePointY =
        centerY +
        (
            focalY -
            canvas.height / 2
        ) /
        oldScale;

    scale =
        newScale;

    centerX =
        imagePointX -
        (
            focalX -
            canvas.width / 2
        ) /
        scale;

    centerY =
        imagePointY -
        (
            focalY -
            canvas.height / 2
        ) /
        scale;

    clampCenter();

    draw();
}

function pointerPosition(event) {
    const rect =
        canvas.getBoundingClientRect();

    const factorX =
        canvas.width /
        rect.width;

    const factorY =
        canvas.height /
        rect.height;

    return {
        x:
            (event.clientX -
                rect.left) *
            factorX,

        y:
            (event.clientY -
                rect.top) *
            factorY
    };
}

canvas.addEventListener(
    "pointerdown",
    event => {
        canvas.setPointerCapture(
            event.pointerId
        );

        pointers.set(
            event.pointerId,
            {
                x:
                    event.clientX,
                y:
                    event.clientY
            }
        );

        if (
            pointers.size === 1
        ) {
            dragging = true;

            lastX =
                event.clientX;

            lastY =
                event.clientY;
        }

        if (
            pointers.size === 2
        ) {
            const values =
                Array.from(
                    pointers.values()
                );

            const dx =
                values[0].x -
                values[1].x;

            const dy =
                values[0].y -
                values[1].y;

            pinchStartDistance =
                Math.hypot(
                    dx,
                    dy
                );

            pinchStartScale =
                scale;

            const rect =
                canvas.getBoundingClientRect();

            pinchCenterX =
                (
                    (
                        values[0].x +
                        values[1].x
                    ) / 2 -
                    rect.left
                ) *
                (
                    canvas.width /
                    rect.width
                );

            pinchCenterY =
                (
                    (
                        values[0].y +
                        values[1].y
                    ) / 2 -
                    rect.top
                ) *
                (
                    canvas.height /
                    rect.height
                );

            dragging = false;
        }
    }
);

canvas.addEventListener(
    "pointermove",
    event => {
        if (
            !pointers.has(
                event.pointerId
            )
        ) {
            return;
        }

        pointers.set(
            event.pointerId,
            {
                x:
                    event.clientX,
                y:
                    event.clientY
            }
        );

        if (
            pointers.size === 1 &&
            dragging
        ) {
            const dx =
                event.clientX -
                lastX;

            const dy =
                event.clientY -
                lastY;

            const rect =
                canvas.getBoundingClientRect();

            centerX -=
                dx *
                (
                    canvas.width /
                    rect.width
                ) /
                scale;

            centerY -=
                dy *
                (
                    canvas.height /
                    rect.height
                ) /
                scale;

            clampCenter();

            lastX =
                event.clientX;

            lastY =
                event.clientY;

            draw();

            return;
        }

        if (
            pointers.size === 2 &&
            pinchStartDistance > 0
        ) {
            const values =
                Array.from(
                    pointers.values()
                );

            const dx =
                values[0].x -
                values[1].x;

            const dy =
                values[0].y -
                values[1].y;

            const distance =
                Math.hypot(
                    dx,
                    dy
                );

            const ratio =
                distance /
                pinchStartDistance;

            setZoom(
                pinchStartScale *
                    ratio,
                pinchCenterX,
                pinchCenterY
            );
        }
    }
);

function endPointer(event) {
    pointers.delete(
        event.pointerId
    );

    if (
        pointers.size < 2
    ) {
        pinchStartDistance =
            0;
    }

    if (
        pointers.size === 1
    ) {
        const remaining =
            Array.from(
                pointers.values()
            )[0];

        dragging = true;

        lastX =
            remaining.x;

        lastY =
            remaining.y;
    }

    if (
        pointers.size === 0
    ) {
        dragging = false;
    }
}

canvas.addEventListener(
    "pointerup",
    endPointer
);

canvas.addEventListener(
    "pointercancel",
    endPointer
);

canvas.addEventListener(
    "wheel",
    event => {
        event.preventDefault();

        const point =
            pointerPosition(
                event
            );

        const factor =
            Math.exp(
                -event.deltaY *
                0.0015
            );

        setZoom(
            scale * factor,
            point.x,
            point.y
        );
    },
    {
        passive: false
    }
);

canvas.addEventListener(
    "dblclick",
    event => {
        const point =
            pointerPosition(
                event
            );

        const newScale =
            scale >=
                minScale * 4
                ? minScale
                : scale * 1.5;

        setZoom(
            newScale,
            point.x,
            point.y
        );
    }
);

async function loadImage() {
    const response =
        await fetch(
            `/api/crop/image?session=${encodeURIComponent(session)}`,
            {
                headers: {
                    "X-Telegram-Init-Data":
                        tg.initData
                },
                cache: "no-store"
            }
        );

    if (!response.ok) {
        throw new Error(
            await response.text()
        );
    }

    const blob =
        await response.blob();

    const objectUrl =
        URL.createObjectURL(
            blob
        );

    await new Promise(
        (resolve, reject) => {
            image.onload =
                resolve;

            image.onerror =
                reject;

            image.src =
                objectUrl;
        }
    );

    URL.revokeObjectURL(
        objectUrl
    );

    imageWidth =
        image.naturalWidth;

    imageHeight =
        image.naturalHeight;

    resizeCanvas();

    calculateMinimumScale();

    scale =
        minScale;

    centerX =
        imageWidth / 2;

    centerY =
        imageHeight / 2;

    clampCenter();

    imageLoaded =
        true;

    draw();

    loading.classList.add(
        "hidden"
    );
}

window.addEventListener(
    "resize",
    () => {
        if (!imageLoaded) {
            return;
        }

        resizeCanvas();

        calculateMinimumScale();

        scale =
            Math.max(
                scale,
                minScale
            );

        clampCenter();

        draw();
    }
);

cancelButton.addEventListener(
    "click",
    async () => {
        cancelButton.disabled =
            true;

        applyButton.disabled =
            true;

        try {
            await fetch(
                "/api/crop/cancel",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "X-Telegram-Init-Data":
                            tg.initData
                    },

                    body:
                        JSON.stringify({
                            session
                        })
                }
            );
        } catch {}

        tg.close();
    }
);

applyButton.addEventListener(
    "click",
    async () => {
        if (!imageLoaded) {
            return;
        }

        applyButton.disabled =
            true;

        cancelButton.disabled =
            true;

        loading.classList.remove(
            "hidden"
        );

        setStatus(
            "Creating profile photo…"
        );

        try {
            const outputCanvas =
                document.createElement(
                    "canvas"
                );

            outputCanvas.width =
                800;

            outputCanvas.height =
                800;

            const output =
                outputCanvas.getContext(
                    "2d",
                    {
                        alpha: false
                    }
                );

            const sourceWidth =
                canvas.width /
                scale;

            const sourceHeight =
                canvas.height /
                scale;

            let sx =
                centerX -
                sourceWidth / 2;

            let sy =
                centerY -
                sourceHeight / 2;

            sx =
                Math.max(
                    0,
                    Math.min(
                        sx,
                        imageWidth -
                            sourceWidth
                    )
                );

            sy =
                Math.max(
                    0,
                    Math.min(
                        sy,
                        imageHeight -
                            sourceHeight
                    )
                );

            output.fillStyle =
                "#000";

            output.fillRect(
                0,
                0,
                800,
                800
            );

            output.drawImage(
                image,
                sx,
                sy,
                sourceWidth,
                sourceHeight,
                0,
                0,
                800,
                800
            );

            const blob =
                await new Promise(
                    resolve =>
                        outputCanvas.toBlob(
                            resolve,
                            "image/jpeg",
                            0.90
                        )
                );

            if (!blob) {
                throw new Error(
                    "Unable to create JPEG."
                );
            }

            setStatus(
                "Changing profile photo…"
            );

            const form =
                new FormData();

            form.append(
                "session",
                session
            );

            form.append(
                "initData",
                tg.initData
            );

            form.append(
                "photo",
                blob,
                "profile.jpg"
            );

            const response =
                await fetch(
                    "/api/crop/submit",
                    {
                        method: "POST",
                        body: form
                    }
                );

            const result =
                await response.json()
                    .catch(
                        () => ({})
                    );

            if (
                !response.ok ||
                !result.success
            ) {
                throw new Error(
                    result.error ||
                    "Unable to change profile photo."
                );
            }

            setStatus(
                "Profile photo changed."
            );

            setTimeout(
                () => tg.close(),
                500
            );
        } catch (error) {
            console.error(
                error
            );

            setStatus(
                error.message ||
                "Something went wrong."
            );

            applyButton.disabled =
                false;

            cancelButton.disabled =
                false;
        }
    }
);

loadImage()
    .catch(error => {
        console.error(
            error
        );

        setStatus(
            error.message ||
            "Unable to load image."
        );
    });
</script>

</body>
</html>
