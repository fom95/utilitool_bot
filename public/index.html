<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>
<title>Profile Photo</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    overscroll-behavior: none;
    touch-action: none;

    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    align-items: center;

    overscroll-behavior: none;
    touch-action: none;
}

.hidden {
    display: none !important;
}

/* =========================
   CROP
   ========================= */

#cropView {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
}

#title {
    width: 100%;
    padding:
        12px
        16px
        8px;

    font-size: 18px;
    font-weight: 600;
}

#cropArea {
    position: relative;

    width: min(
        100vw,
        100vh - 120px
    );

    height: min(
        100vw,
        100vh - 120px
    );

    max-width: 800px;
    max-height: 800px;

    overflow: hidden;

    background: #000;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;
}

#canvas {
    display: block;

    width: 100%;
    height: 100%;

    touch-action: none;
}

#hint {
    width: 100%;
    padding:
        8px
        16px;

    text-align: center;

    font-size: 14px;

    opacity: .7;
}

#deleteOption,
#saveOption {
    width: 100%;

    padding:
        2px
        16px
        6px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    font-size: 14px;

    opacity: .85;
}

#deleteOption input,
#saveOption input {
    width: 18px;
    height: 18px;

    margin: 0;

    accent-color:
        var(
            --tg-theme-button-color,
            #2481cc
        );
}

#deleteOption label,
#saveOption label {
    cursor: pointer;
}

#cropButtons {
    width: 100%;

    display: flex;

    gap: 10px;

    padding:
        10px
        16px
        calc(
            10px +
            env(safe-area-inset-bottom)
        );
}

button {
    flex: 1;

    min-height: 46px;

    border: 0;
    border-radius: 10px;

    background:
        var(
            --tg-theme-secondary-bg-color,
            #eeeeee
        );

    color:
        var(
            --tg-theme-text-color,
            #000000
        );

    font-size: 16px;
    font-weight: 600;
}

#apply {
    background:
        var(
            --tg-theme-button-color,
            #2481cc
        );

    color:
        var(
            --tg-theme-button-text-color,
            #ffffff
        );
}

button:disabled {
    opacity: .5;
}

/* =========================
   LOADING
   ========================= */

#loading {
    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        var(
            --tg-theme-bg-color,
            #ffffff
        );

    z-index: 10;
}

#loadingContent {
    width: min(
        80vw,
        360px
    );

    text-align: center;
}

#loading.hidden {
    display: none;
}

#status {
    padding: 16px;

    text-align: center;

    font-size: 16px;
}

#progressContainer {
    width: 100%;

    height: 8px;

    margin-top: 14px;

    overflow: hidden;

    border-radius: 999px;

    background:
        var(
            --tg-theme-secondary-bg-color,
            #eeeeee
        );
}

#progressBar {
    width: 0%;

    height: 100%;

    border-radius: 999px;

    background:
        var(
            --tg-theme-button-color,
            #2481cc
        );

    transition:
        width 0.1s linear;
}

#progressText {
    margin-top: 8px;

    font-size: 13px;

    opacity: .65;
}

/* =========================
   LIBRARY
   ========================= */

#libraryView {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

#libraryHeader {
    width: 100%;

    padding:
        12px
        16px
        8px;

    font-size: 18px;
    font-weight: 600;
}

#libraryFilter {
    width: calc(
        100% - 32px
    );

    margin:
        0
        16px
        10px;

    min-height: 44px;

    padding:
        0
        12px;

    border: 0;
    border-radius: 10px;

    background:
        var(
            --tg-theme-secondary-bg-color,
            #eeeeee
        );

    color:
        var(
            --tg-theme-text-color,
            #000000
        );

    font-size: 15px;
}

#libraryStatus {
    width: 100%;

    padding:
        4px
        16px
        10px;

    text-align: center;

    font-size: 13px;

    opacity: .65;
}

#libraryGrid {
    flex: 1;

    width: 100%;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        4px
        10px
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    display: grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0, 1fr)
        );

    gap: 8px;

    align-content: start;

    touch-action: pan-y;
}

.libraryItem {
    position: relative;

    aspect-ratio: 1;

    overflow: hidden;

    border-radius: 10px;

    background:
        var(
            --tg-theme-secondary-bg-color,
            #eeeeee
        );
}

.libraryItem img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.libraryItem:active {
    opacity: .7;
}

.libraryDelete {
    position: absolute;

    top: 5px;
    right: 5px;

    width: 30px;
    min-height: 30px;

    padding: 0;

    border-radius: 50%;

    background:
        rgba(
            0,
            0,
            0,
            .65
        );

    color: #fff;

    font-size: 16px;

    z-index: 2;
}

#libraryEmpty {
    grid-column:
        1 / -1;

    padding:
        40px
        20px;

    text-align: center;

    font-size: 15px;

    opacity: .65;
}

/* =========================
   LIBRARY PREVIEW
   ========================= */

#libraryPreview {
    position: fixed;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding:
        20px;

    background:
        rgba(
            0,
            0,
            0,
            .9
        );

    z-index: 20;

    touch-action: none;
}

#libraryPreviewImage {
    display: block;

    width: min(
        90vw,
        600px
    );

    height: min(
        70vh,
        600px
    );

    object-fit: contain;

    border-radius: 8px;
}

#libraryPreviewInfo {
    width: min(
        90vw,
        600px
    );

    margin-top: 12px;

    text-align: center;

    color: #fff;

    font-size: 14px;
}

#libraryPreviewButtons {
    width: min(
        90vw,
        600px
    );

    display: flex;

    gap: 10px;

    margin-top: 14px;
}

#libraryPreviewButtons button {
    min-height: 46px;
}

#libraryApply {
    background:
        var(
            --tg-theme-button-color,
            #2481cc
        );

    color:
        var(
            --tg-theme-button-text-color,
            #ffffff
        );
}

#libraryClose {
    background:
        var(
            --tg-theme-secondary-bg-color,
            #eeeeee
        );

    color:
        var(
            --tg-theme-text-color,
            #000000
        );
}
</style>
</head>

<body>

<!-- =========================
     CROP VIEW
     ========================= -->

<div id="cropView" class="hidden">

    <div id="title">
        Position Profile Photo
    </div>

    <div id="cropArea">
        <canvas id="canvas"></canvas>
    </div>

    <div id="hint">
        Drag to position · Pinch or scroll to zoom
    </div>

    <div id="deleteOption">
        <input
            type="checkbox"
            id="deleteNewChatPhoto"
            checked
        >

        <label for="deleteNewChatPhoto">
            Delete the generated profile-photo message
        </label>
    </div>

    <div id="saveOption">
        <input
            type="checkbox"
            id="saveProfilePhoto"
            checked
        >

        <label for="saveProfilePhoto">
            Save profile photo to library
        </label>
    </div>

    <div id="cropButtons">
        <button id="cancel">
            Cancel
        </button>

        <button id="apply">
            Apply
        </button>
    </div>

</div>

<!-- =========================
     LIBRARY VIEW
     ========================= -->

<div id="libraryView" class="hidden">

    <div id="libraryHeader">
        Profile Photo Library
    </div>

    <select id="libraryFilter">
        <option value="current">
            Current Chat
        </option>

        <option value="all">
            All Chats
        </option>
    </select>

    <div id="libraryStatus">
        Loading library…
    </div>

    <div id="libraryGrid"></div>

</div>

<!-- =========================
     LIBRARY PREVIEW
     ========================= -->

<div id="libraryPreview" class="hidden">

    <img
        id="libraryPreviewImage"
        alt=""
    >

    <div id="libraryPreviewInfo"></div>

    <div id="libraryPreviewButtons">

        <button id="libraryClose">
            Close
        </button>

        <button id="libraryApply">
            Apply
        </button>

    </div>

</div>

<!-- =========================
     LOADING
     ========================= -->

<div id="loading">

    <div id="loadingContent">

        <div id="status">
            Loading…
        </div>

        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>

        <div id="progressText">
            0%
        </div>

    </div>

</div>

<script>
const tg =
    window.Telegram &&
    window.Telegram.WebApp;

if (!tg) {
    document.body.textContent =
        "This page must be opened inside Telegram.";

    throw new Error(
        "Telegram WebApp unavailable."
    );
}

tg.ready();
tg.expand();

if (
    typeof tg.disableVerticalSwipes ===
    "function"
) {
    tg.disableVerticalSwipes();
}

const params =
    new URLSearchParams(
        location.search
    );

const startParam =
    params.get(
        "tgWebAppStartParam"
    ) ||
    params.get(
        "startapp"
    ) ||
    tg.initDataUnsafe?.start_param ||
    "";

const libraryMode =
    /^library_-?\d+$/.test(
        startParam
    );

const session =
    libraryMode
        ? ""
        : (
            params.get("session") ||
            startParam
        );

/* =========================
   SHARED
   ========================= */

const loading =
    document.getElementById(
        "loading"
    );

const status =
    document.getElementById(
        "status"
    );

function setStatus(text) {
    status.textContent =
        text;
}

function hideLoading() {
    loading.classList.add(
        "hidden"
    );
}

function showLoading(text) {
    setStatus(text);

    loading.classList.remove(
        "hidden"
    );
}

/* =========================
   LIBRARY
   ========================= */

const libraryView =
    document.getElementById(
        "libraryView"
    );

const libraryFilter =
    document.getElementById(
        "libraryFilter"
    );

const libraryStatus =
    document.getElementById(
        "libraryStatus"
    );

const libraryGrid =
    document.getElementById(
        "libraryGrid"
    );

const libraryPreview =
    document.getElementById(
        "libraryPreview"
    );

const libraryPreviewImage =
    document.getElementById(
        "libraryPreviewImage"
    );

const libraryPreviewInfo =
    document.getElementById(
        "libraryPreviewInfo"
    );

const libraryApply =
    document.getElementById(
        "libraryApply"
    );

const libraryClose =
    document.getElementById(
        "libraryClose"
    );

let libraryData =
    null;

let selectedLibraryPhoto =
    null;

function libraryPhotoUrl(photo) {
    return (
        "/api/library/photo?id=" +
        encodeURIComponent(
            photo.id
        ) +
        "&_=" +
        Date.now()
    );
}

function renderLibraryFilter() {
    if (!libraryData) {
        return;
    }

    const currentChat =
        libraryData.currentChat;

    libraryFilter.innerHTML =
        "";

    const currentOption =
        document.createElement(
            "option"
        );

    currentOption.value =
        "current";

    currentOption.textContent =
        currentChat.title ||
        "Current Chat";

    libraryFilter.appendChild(
        currentOption
    );

    const allOption =
        document.createElement(
            "option"
        );

    allOption.value =
        "all";

    allOption.textContent =
        "All Chats";

    libraryFilter.appendChild(
        allOption
    );

    const chats =
        Array.isArray(
            libraryData.chats
        )
            ? libraryData.chats
            : [];

    for (
        const chat of chats
    ) {
        if (
            String(chat.id) ===
            String(currentChat.id)
        ) {
            continue;
        }

        const option =
            document.createElement(
                "option"
            );

        option.value =
            String(chat.id);

        option.textContent =
            chat.title ||
            chat.username ||
            String(chat.id);

        libraryFilter.appendChild(
            option
        );
    }
}

function getFilteredLibrary() {
    if (!libraryData) {
        return [];
    }

    const photos =
        Array.isArray(
            libraryData.photos
        )
            ? libraryData.photos
            : [];

    const filter =
        libraryFilter.value;

    if (
        filter === "all"
    ) {
        return photos;
    }

    const currentChatId =
        filter === "current"
            ? libraryData.currentChat.id
            : filter;

    return photos.filter(
        photo =>
            Array.isArray(
                photo.sourceChats
            ) &&
            photo.sourceChats.some(
                chat =>
                    String(chat.id) ===
                    String(currentChatId)
            )
    );
}

function renderLibrary() {
    const photos =
        getFilteredLibrary();

    libraryGrid.innerHTML =
        "";

    libraryStatus.textContent =
        `${photos.length} photo${
            photos.length === 1
                ? ""
                : "s"
        }`;

    if (!photos.length) {
        const empty =
            document.createElement(
                "div"
            );

        empty.id =
            "libraryEmpty";

        empty.textContent =
            "No saved profile photos here.";

        libraryGrid.appendChild(
            empty
        );

        return;
    }

    for (
        const photo of photos
    ) {
        const item =
            document.createElement(
                "div"
            );

        item.className =
            "libraryItem";

        const image =
            document.createElement(
                "img"
            );

        image.loading =
            "lazy";

        image.alt =
            "Profile photo";

        image.src =
            libraryPhotoUrl(
                photo
            );

        const deleteButton =
            document.createElement(
                "button"
            );

        deleteButton.className =
            "libraryDelete";

        deleteButton.textContent =
            "×";

        deleteButton.title =
            "Delete";

        deleteButton.addEventListener(
            "click",
            event => {
                event.stopPropagation();

                deleteLibraryPhoto(
                    photo
                );
            }
        );

        item.appendChild(
            image
        );

        item.appendChild(
            deleteButton
        );

        item.addEventListener(
            "click",
            () => {
                openLibraryPhoto(
                    photo
                );
            }
        );

        libraryGrid.appendChild(
            item
        );
    }
}

function openLibraryPhoto(
    photo
) {
    selectedLibraryPhoto =
        photo;

    libraryPreviewImage.src =
        libraryPhotoUrl(
            photo
        );

    const sourceChats =
        Array.isArray(
            photo.sourceChats
        )
            ? photo.sourceChats
            : [];
    
    if (sourceChats.length) {
        libraryPreviewInfo.textContent =
            `From ${sourceChats
                .map(
                    chat =>
                        chat.title ||
                        chat.username ||
                        String(chat.id)
                )
                .join(", ")}`;
    } else {
        libraryPreviewInfo.textContent =
            "Saved profile photo";
    }

    libraryPreview.classList.remove(
        "hidden"
    );
}

function closeLibraryPreview() {
    selectedLibraryPhoto =
        null;

    libraryPreview.classList.add(
        "hidden"
    );

    libraryPreviewImage.removeAttribute(
        "src"
    );
}

async function deleteLibraryPhoto(
    photo
) {
    if (
        !confirm(
            "Delete this saved profile photo?"
        )
    ) {
        return;
    }

    try {
        const response =
            await fetch(
                "/api/library/delete",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "X-Telegram-Init-Data":
                            tg.initData
                    },

                    body:
                        JSON.stringify({
                            id:
                                photo.id
                        })
                }
            );

        const result =
            await response.json()
                .catch(
                    () => ({})
                );

        if (
            !response.ok ||
            !result.success
        ) {
            throw new Error(
                result.error ||
                "Unable to delete photo."
            );
        }

        libraryData.photos =
            libraryData.photos.filter(
                item =>
                    String(item.id) !==
                    String(photo.id)
            );

        if (
            selectedLibraryPhoto &&
            String(
                selectedLibraryPhoto.id
            ) ===
            String(photo.id)
        ) {
            closeLibraryPreview();
        }

        renderLibrary();
    } catch (error) {
        console.error(
            error
        );

        tg.showAlert(
            error.message ||
            "Unable to delete photo."
        );
    }
}

libraryFilter.addEventListener(
    "change",
    renderLibrary
);

libraryClose.addEventListener(
    "click",
    closeLibraryPreview
);

libraryApply.addEventListener(
    "click",
    async () => {
        if (
            !selectedLibraryPhoto
        ) {
            return;
        }

        libraryApply.disabled =
            true;

        showLoading(
            "Changing profile photo…"
        );

        try {
            const response =
                await fetch(
                    "/api/library/apply",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "X-Telegram-Init-Data":
                                tg.initData
                        },

                        body:
                            JSON.stringify({
                                id:
                                    selectedLibraryPhoto.id,

                                deleteNewChatPhoto:
                                    "1"
                            })
                    }
                );

            const result =
                await response.json()
                    .catch(
                        () => ({})
                    );

            if (
                !response.ok ||
                !result.success
            ) {
                throw new Error(
                    result.error ||
                    "Unable to change profile photo."
                );
            }

            setStatus(
                "Profile photo changed."
            );

            setTimeout(
                () => tg.close(),
                500
            );
        } catch (error) {
            console.error(
                error
            );

            hideLoading();

            libraryApply.disabled =
                false;

            tg.showAlert(
                error.message ||
                "Unable to change profile photo."
            );
        }
    }
);

async function loadLibrary() {
    libraryView.classList.remove(
        "hidden"
    );

    showLoading(
        "Loading library…"
    );

    try {
        const response =
            await fetch(
                "/api/library",
                {
                    headers: {
                        "X-Telegram-Init-Data":
                            tg.initData
                    }
                }
            );

        const result =
            await response.json()
                .catch(
                    () => ({})
                );

        if (
            !response.ok ||
            !result.success
        ) {
            throw new Error(
                result.error ||
                "Unable to load library."
            );
        }

        libraryData =
            result;

        renderLibraryFilter();

        renderLibrary();

        hideLoading();
    } catch (error) {
        console.error(
            error
        );

        setStatus(
            error.message ||
            "Unable to load library."
        );
    }
}

/* =========================
   CROP
   ========================= */

const cropView =
    document.getElementById(
        "cropView"
    );

const cropArea =
    document.getElementById(
        "cropArea"
    );

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha: false
        }
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const progressContainer =
    document.getElementById(
        "progressContainer"
    );

const progressText =
    document.getElementById(
        "progressText"
    );

const deleteNewChatPhoto =
    document.getElementById(
        "deleteNewChatPhoto"
    );

const saveProfilePhoto =
    document.getElementById(
        "saveProfilePhoto"
    );

const applyButton =
    document.getElementById(
        "apply"
    );

const cancelButton =
    document.getElementById(
        "cancel"
    );

let image =
    new Image();

let imageLoaded =
    false;

let imageWidth =
    0;

let imageHeight =
    0;

let scale =
    1;

let minScale =
    1;

let centerX =
    0;

let centerY =
    0;

let dragging =
    false;

let lastX =
    0;

let lastY =
    0;

let pinchStartDistance =
    0;

let pinchStartScale =
    1;

let pinchCenterX =
    0;

let pinchCenterY =
    0;

let pointers =
    new Map();

function setProgress(
    loaded,
    total
) {
    if (
        !total ||
        total <= 0
    ) {
        progressBar.style.width =
            "0%";

        progressText.textContent =
            "Loading…";

        return;
    }

    const percent =
        Math.max(
            0,
            Math.min(
                100,
                Math.round(
                    loaded /
                    total *
                    100
                )
            )
        );

    progressBar.style.width =
        `${percent}%`;

    progressText.textContent =
        `${percent}%`;
}

function hideLoadingProgress() {
    progressContainer.style.display =
        "none";

    progressText.style.display =
        "none";
}

function showLoadingProgress() {
    progressContainer.style.display =
        "";

    progressText.style.display =
        "";
}

function resizeCanvas() {
    const rect =
        cropArea.getBoundingClientRect();

    const size =
        Math.max(
            1,
            Math.round(
                rect.width *
                devicePixelRatio
            )
        );

    canvas.width =
        size;

    canvas.height =
        size;

    draw();
}

function calculateMinimumScale() {
    minScale =
        Math.max(
            canvas.width /
                imageWidth,
            canvas.height /
                imageHeight
        );
}

function clampCenter() {
    const visibleWidth =
        canvas.width / scale;

    const visibleHeight =
        canvas.height / scale;

    const halfVisibleWidth =
        visibleWidth / 2;

    const halfVisibleHeight =
        visibleHeight / 2;

    const minCenterX =
        halfVisibleWidth;

    const maxCenterX =
        imageWidth -
        halfVisibleWidth;

    const minCenterY =
        halfVisibleHeight;

    const maxCenterY =
        imageHeight -
        halfVisibleHeight;

    if (
        visibleWidth >=
        imageWidth
    ) {
        centerX =
            imageWidth / 2;
    } else {
        centerX =
            Math.max(
                minCenterX,
                Math.min(
                    centerX,
                    maxCenterX
                )
            );
    }

    if (
        visibleHeight >=
        imageHeight
    ) {
        centerY =
            imageHeight / 2;
    } else {
        centerY =
            Math.max(
                minCenterY,
                Math.min(
                    centerY,
                    maxCenterY
                )
            );
    }
}

function draw() {
    if (!imageLoaded) {
        return;
    }

    const size =
        canvas.width;

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        size,
        size
    );

    const sourceWidth =
        size / scale;

    const sourceHeight =
        size / scale;

    const sx =
        centerX -
        sourceWidth / 2;

    const sy =
        centerY -
        sourceHeight / 2;

    ctx.drawImage(
        image,
        sx,
        sy,
        sourceWidth,
        sourceHeight,
        0,
        0,
        size,
        size
    );
}

function setZoom(
    newScale,
    focalX,
    focalY
) {
    newScale =
        Math.max(
            minScale,
            Math.min(
                minScale * 8,
                newScale
            )
        );

    const oldScale =
        scale;

    if (
        newScale === oldScale
    ) {
        return;
    }

    const imagePointX =
        centerX +
        (
            focalX -
            canvas.width / 2
        ) /
        oldScale;

    const imagePointY =
        centerY +
        (
            focalY -
            canvas.height / 2
        ) /
        oldScale;

    scale =
        newScale;

    centerX =
        imagePointX -
        (
            focalX -
            canvas.width / 2
        ) /
        scale;

    centerY =
        imagePointY -
        (
            focalY -
            canvas.height / 2
        ) /
        scale;

    clampCenter();

    draw();
}

function pointerPosition(event) {
    const rect =
        canvas.getBoundingClientRect();

    const factorX =
        canvas.width /
        rect.width;

    const factorY =
        canvas.height /
        rect.height;

    return {
        x:
            (
                event.clientX -
                rect.left
            ) *
            factorX,

        y:
            (
                event.clientY -
                rect.top
            ) *
            factorY
    };
}

canvas.addEventListener(
    "pointerdown",
    event => {
        canvas.setPointerCapture(
            event.pointerId
        );

        pointers.set(
            event.pointerId,
            {
                x:
                    event.clientX,
                y:
                    event.clientY
            }
        );

        if (
            pointers.size === 1
        ) {
            dragging = true;

            lastX =
                event.clientX;

            lastY =
                event.clientY;
        }

        if (
            pointers.size === 2
        ) {
            const values =
                Array.from(
                    pointers.values()
                );

            const dx =
                values[0].x -
                values[1].x;

            const dy =
                values[0].y -
                values[1].y;

            pinchStartDistance =
                Math.hypot(
                    dx,
                    dy
                );

            pinchStartScale =
                scale;

            const rect =
                canvas.getBoundingClientRect();

            pinchCenterX =
                (
                    (
                        values[0].x +
                        values[1].x
                    ) / 2 -
                    rect.left
                ) *
                (
                    canvas.width /
                    rect.width
                );

            pinchCenterY =
                (
                    (
                        values[0].y +
                        values[1].y
                    ) / 2 -
                    rect.top
                ) *
                (
                    canvas.height /
                    rect.height
                );

            dragging = false;
        }
    }
);

canvas.addEventListener(
    "pointermove",
    event => {
        if (
            !pointers.has(
                event.pointerId
            )
        ) {
            return;
        }

        pointers.set(
            event.pointerId,
            {
                x:
                    event.clientX,
                y:
                    event.clientY
            }
        );

        if (
            pointers.size === 1 &&
            dragging
        ) {
            const dx =
                event.clientX -
                lastX;

            const dy =
                event.clientY -
                lastY;

            const rect =
                canvas.getBoundingClientRect();

            centerX -=
                dx *
                (
                    canvas.width /
                    rect.width
                ) /
                scale;

            centerY -=
                dy *
                (
                    canvas.height /
                    rect.height
                ) /
                scale;

            clampCenter();

            lastX =
                event.clientX;

            lastY =
                event.clientY;

            draw();

            return;
        }

        if (
            pointers.size === 2 &&
            pinchStartDistance > 0
        ) {
            const values =
                Array.from(
                    pointers.values()
                );

            const dx =
                values[0].x -
                values[1].x;

            const dy =
                values[0].y -
                values[1].y;

            const distance =
                Math.hypot(
                    dx,
                    dy
                );

            const ratio =
                distance /
                pinchStartDistance;

            setZoom(
                pinchStartScale *
                    ratio,
                pinchCenterX,
                pinchCenterY
            );
        }
    }
);

function endPointer(event) {
    pointers.delete(
        event.pointerId
    );

    if (
        pointers.size < 2
    ) {
        pinchStartDistance =
            0;
    }

    if (
        pointers.size === 1
    ) {
        const remaining =
            Array.from(
                pointers.values()
            )[0];

        dragging = true;

        lastX =
            remaining.x;

        lastY =
            remaining.y;
    }

    if (
        pointers.size === 0
    ) {
        dragging = false;
    }
}

canvas.addEventListener(
    "pointerup",
    endPointer
);

canvas.addEventListener(
    "pointercancel",
    endPointer
);

canvas.addEventListener(
    "wheel",
    event => {
        event.preventDefault();

        const point =
            pointerPosition(
                event
            );

        const factor =
            Math.exp(
                -event.deltaY *
                0.0015
            );

        setZoom(
            scale * factor,
            point.x,
            point.y
        );
    },
    {
        passive: false
    }
);

canvas.addEventListener(
    "dblclick",
    event => {
        const point =
            pointerPosition(
                event
            );

        const newScale =
            scale >=
                minScale * 4
                ? minScale
                : scale * 1.5;

        setZoom(
            newScale,
            point.x,
            point.y
        );
    }
);

async function loadImage() {
    showLoadingProgress();

    setStatus(
        "Loading image…"
    );

    setProgress(
        0,
        0
    );

    const blob =
        await new Promise(
            (resolve, reject) => {
                const xhr =
                    new XMLHttpRequest();

                xhr.open(
                    "GET",
                    `/api/crop/image?session=${encodeURIComponent(session)}`
                );

                xhr.setRequestHeader(
                    "X-Telegram-Init-Data",
                    tg.initData
                );

                xhr.responseType =
                    "blob";

                xhr.setRequestHeader(
                    "Cache-Control",
                    "no-cache"
                );

                xhr.onprogress =
                    event => {
                        setProgress(
                            event.loaded,
                            event.lengthComputable
                                ? event.total
                                : 0
                        );
                    };

                xhr.onload =
                    () => {
                        if (
                            xhr.status >= 200 &&
                            xhr.status < 300
                        ) {
                            setProgress(
                                xhr.response.size,
                                xhr.response.size
                            );

                            resolve(
                                xhr.response
                            );

                            return;
                        }

                        const reader =
                            new FileReader();

                        reader.onload =
                            () => {
                                reject(
                                    new Error(
                                        reader.result ||
                                        `Unable to load image (${xhr.status}).`
                                    )
                                );
                            };

                        reader.onerror =
                            () => {
                                reject(
                                    new Error(
                                        `Unable to load image (${xhr.status}).`
                                    )
                                );
                            };

                        reader.readAsText(
                            xhr.response
                        );
                    };

                xhr.onerror =
                    () => {
                        reject(
                            new Error(
                                "Unable to connect to the image server."
                            )
                        );
                    };

                xhr.onabort =
                    () => {
                        reject(
                            new Error(
                                "Image download was cancelled."
                            )
                        );
                    };

                xhr.send();
            }
        );

    const objectUrl =
        URL.createObjectURL(
            blob
        );

    await new Promise(
        (resolve, reject) => {
            image.onload =
                resolve;

            image.onerror =
                reject;

            image.src =
                objectUrl;
        }
    );

    URL.revokeObjectURL(
        objectUrl
    );

    imageWidth =
        image.naturalWidth;

    imageHeight =
        image.naturalHeight;

    setProgress(
        1,
        1
    );

    resizeCanvas();

    calculateMinimumScale();

    scale =
        minScale;

    centerX =
        imageWidth / 2;

    centerY =
        imageHeight / 2;

    clampCenter();

    imageLoaded =
        true;

    draw();

    hideLoadingProgress();

    hideLoading();
}

window.addEventListener(
    "resize",
    () => {
        if (!imageLoaded) {
            return;
        }

        resizeCanvas();

        calculateMinimumScale();

        scale =
            Math.max(
                scale,
                minScale
            );

        clampCenter();

        draw();
    }
);

cancelButton.addEventListener(
    "click",
    async () => {
        cancelButton.disabled =
            true;

        applyButton.disabled =
            true;

        try {
            await fetch(
                "/api/crop/cancel",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "X-Telegram-Init-Data":
                            tg.initData
                    },

                    body:
                        JSON.stringify({
                            session
                        })
                }
            );
        } catch {}

        tg.close();
    }
);

applyButton.addEventListener(
    "click",
    async () => {
        if (!imageLoaded) {
            return;
        }

        applyButton.disabled =
            true;

        cancelButton.disabled =
            true;

        loading.classList.remove(
            "hidden"
        );

        hideLoadingProgress();

        setStatus(
            "Creating profile photo…"
        );

        try {
            const outputCanvas =
                document.createElement(
                    "canvas"
                );

            outputCanvas.width =
                800;

            outputCanvas.height =
                800;

            const output =
                outputCanvas.getContext(
                    "2d",
                    {
                        alpha: false
                    }
                );

            const sourceWidth =
                canvas.width /
                scale;

            const sourceHeight =
                canvas.height /
                scale;

            let sx =
                centerX -
                sourceWidth / 2;

            let sy =
                centerY -
                sourceHeight / 2;

            sx =
                Math.max(
                    0,
                    Math.min(
                        sx,
                        imageWidth -
                            sourceWidth
                    )
                );

            sy =
                Math.max(
                    0,
                    Math.min(
                        sy,
                        imageHeight -
                            sourceHeight
                    )
                );

            output.fillStyle =
                "#000";

            output.fillRect(
                0,
                0,
                800,
                800
            );

            output.drawImage(
                image,
                sx,
                sy,
                sourceWidth,
                sourceHeight,
                0,
                0,
                800,
                800
            );

            const blob =
                await new Promise(
                    resolve =>
                        outputCanvas.toBlob(
                            resolve,
                            "image/jpeg",
                            0.90
                        )
                );

            if (!blob) {
                throw new Error(
                    "Unable to create JPEG."
                );
            }

            setStatus(
                "Changing profile photo…"
            );

            const form =
                new FormData();

            form.append(
                "session",
                session
            );

            form.append(
                "initData",
                tg.initData
            );

            form.append(
                "deleteNewChatPhoto",
                deleteNewChatPhoto.checked
                    ? "1"
                    : "0"
            );

            form.append(
                "saveProfilePhoto",
                saveProfilePhoto.checked
                    ? "1"
                    : "0"
            );

            form.append(
                "photo",
                blob,
                "profile.jpg"
            );

            const response =
                await fetch(
                    "/api/crop/submit",
                    {
                        method: "POST",
                        body: form
                    }
                );

            const result =
                await response.json()
                    .catch(
                        () => ({})
                    );

            if (
                !response.ok ||
                !result.success
            ) {
                throw new Error(
                    result.error ||
                    "Unable to change profile photo."
                );
            }

            setStatus(
                "Profile photo changed."
            );

            setTimeout(
                () => tg.close(),
                500
            );
        } catch (error) {
            console.error(
                error
            );

            setStatus(
                error.message ||
                "Something went wrong."
            );

            applyButton.disabled =
                false;

            cancelButton.disabled =
                false;
        }
    }
);

/* =========================
   START
   ========================= */

if (libraryMode) {
    loadLibrary();
} else {
    if (!session) {
        setStatus(
            "The crop session is missing."
        );

        throw new Error(
            "Missing session."
        );
    }

    cropView.classList.remove(
        "hidden"
    );

    loadImage()
        .catch(error => {
            console.error(
                error
            );

            setStatus(
                error.message ||
                "Unable to load image."
            );
        });
}
</script>
