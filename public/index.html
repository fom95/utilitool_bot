<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Photo Cropper</title>

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
            --text: var(--tg-theme-text-color, #111111);
            --hint: var(--tg-theme-hint-color, #777777);
            --button: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --destructive: var(--tg-theme-destructive-text-color, #ff3b30);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        body {
            padding:
                max(12px, env(safe-area-inset-top))
                max(12px, env(safe-area-inset-right))
                max(12px, env(safe-area-inset-bottom))
                max(12px, env(safe-area-inset-left));
        }

        #app {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        #status {
            min-height: 20px;
            color: var(--hint);
            font-size: 14px;
            text-align: center;
        }

        #crop-area {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #000;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #image {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform-origin: center center;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        #crop-window {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #crop-window::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 255, 255, 0.95);
            box-shadow:
                0 0 0 9999px rgba(0, 0, 0, 0.48);
        }

        #crop-window::after {
            content: "";
            position: absolute;
            left: 33.333%;
            right: 33.333%;
            top: 0;
            bottom: 0;
            border-left: 1px solid rgba(255, 255, 255, 0.28);
            border-right: 1px solid rgba(255, 255, 255, 0.28);
        }

        #crop-grid {
            position: absolute;
            inset: 0;
        }

        #crop-grid::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 33.333%;
            bottom: 33.333%;
            border-top: 1px solid rgba(255, 255, 255, 0.28);
            border-bottom: 1px solid rgba(255, 255, 255, 0.28);
        }

        #focus-point {
            position: absolute;
            width: 18px;
            height: 18px;
            margin-left: -9px;
            margin-top: -9px;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            display: none;
        }

        #controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        button {
            appearance: none;
            border: 0;
            border-radius: 10px;
            min-height: 46px;
            padding: 10px 14px;
            background: var(--secondary-bg);
            color: var(--text);
            font: inherit;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.97);
        }

        button.primary {
            background: var(--button);
            color: var(--button-text);
            font-weight: 600;
        }

        button.destructive {
            color: var(--destructive);
        }

        button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        #zoom-value {
            text-align: center;
            font-size: 14px;
            color: var(--hint);
            min-height: 20px;
        }

        #instructions {
            color: var(--hint);
            font-size: 13px;
            line-height: 1.4;
            text-align: center;
        }

        #error {
            display: none;
            padding: 12px;
            border-radius: 10px;
            background: var(--secondary-bg);
            color: var(--destructive);
            font-size: 14px;
            text-align: center;
        }

        @media (min-width: 600px) {
            #app {
                padding-top: 10px;
            }

            #crop-area {
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <div id="status">
        Loading photo...
    </div>

    <div id="crop-area">
        <img
            id="image"
            alt="Photo being cropped"
            draggable="false"
        >

        <div id="crop-window">
            <div id="crop-grid"></div>
        </div>

        <div id="focus-point"></div>
    </div>

    <div id="zoom-value">
        Zoom: 1.00×
    </div>

    <div id="controls">

        <div class="control-row">
            <button
                id="zoom-out"
                type="button"
            >
                −
            </button>

            <button
                id="reset"
                type="button"
            >
                Reset
            </button>

            <button
                id="zoom-in"
                type="button"
            >
                +
            </button>
        </div>

        <button
            id="submit"
            class="primary"
            type="button"
        >
            Set Profile Photo
        </button>

        <button
            id="cancel"
            class="destructive"
            type="button"
        >
            Cancel
        </button>

    </div>

    <div id="instructions">
        Tap to center that point. Drag to move the image.
        Pinch or scroll to zoom.
    </div>

    <div id="error"></div>

</div>

<script>
(() => {
    "use strict";

    const tg =
        window.Telegram &&
        window.Telegram.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();
    }

    const image =
        document.getElementById("image");

    const cropArea =
        document.getElementById("crop-area");

    const focusPoint =
        document.getElementById("focus-point");

    const status =
        document.getElementById("status");

    const errorBox =
        document.getElementById("error");

    const zoomValue =
        document.getElementById("zoom-value");

    const zoomOut =
        document.getElementById("zoom-out");

    const zoomIn =
        document.getElementById("zoom-in");

    const resetButton =
        document.getElementById("reset");

    const submitButton =
        document.getElementById("submit");

    const cancelButton =
        document.getElementById("cancel");

    const params =
        new URLSearchParams(
            window.location.search
        );

    /*
     * The bot will eventually generate this.
     *
     * Example:
     *
     * /?session=abc123
     */
    const session =
        params.get("session");

    /*
     * Current crop state.
     *
     * x/y:
     *   normalized image position.
     *
     * zoom:
     *   1 = entire smallest dimension visible.
     *   5 = 5x zoom.
     */
    const state = {
        x: 0.5,
        y: 0.5,
        zoom: 1,

        minZoom: 1,
        maxZoom: 5,
        zoomStep: 0.25,

        imageWidth: 0,
        imageHeight: 0,

        pointers: new Map(),

        dragging: false,

        dragStartX: 0,
        dragStartY: 0,

        dragOriginX: 0.5,
        dragOriginY: 0.5,

        pinchDistance: 0,
        pinchZoom: 1,
        pinchCenterX: 0,
        pinchCenterY: 0,

        focusX: 0.5,
        focusY: 0.5
    };

    function clamp(
        value,
        min,
        max
    ) {
        return Math.max(
            min,
            Math.min(
                max,
                value
            )
        );
    }

    function showError(message) {
        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";

        status.textContent =
            "";
    }

    function setStatus(message) {
        status.textContent =
            message;

        errorBox.style.display =
            "none";
    }

    function getCropDimensions() {
        const width =
            state.imageWidth;

        const height =
            state.imageHeight;

        const base =
            Math.min(
                width,
                height
            );

        const size =
            Math.max(
                1,
                base / state.zoom
            );

        return {
            width: Math.min(
                size,
                width
            ),

            height: Math.min(
                size,
                height
            )
        };
    }

    function updateBounds() {
        if (
            !state.imageWidth ||
            !state.imageHeight
        ) {
            return;
        }

        const crop =
            getCropDimensions();

        const maxX =
            Math.max(
                0,
                state.imageWidth -
                crop.width
            );

        const maxY =
            Math.max(
                0,
                state.imageHeight -
                crop.height
            );

        /*
         * x/y represent the normalized
         * position of the crop window
         * inside the available movement.
         */
        state.x =
            clamp(
                state.x,
                0,
                1
            );

        state.y =
            clamp(
                state.y,
                0,
                1
            );

        /*
         * If the image is square or the
         * zoom is 1, movement is naturally
         * zero.
         */
        if (!maxX) {
            state.x = 0.5;
        }

        if (!maxY) {
            state.y = 0.5;
        }
    }

    function render() {
        updateBounds();

        const zoom =
            state.zoom;

        /*
         * We use CSS scaling for display.
         * The actual crop coordinates are
         * still sent to the backend.
         */
        image.style.transform =
            `scale(${zoom})`;

        /*
         * Translate the image so x/y
         * determine which part is centered.
         */
        const tx =
            (0.5 - state.x) * 100;

        const ty =
            (0.5 - state.y) * 100;

        image.style.transform =
            `translate(${tx}%, ${ty}%) scale(${zoom})`;

        zoomValue.textContent =
            `Zoom: ${zoom.toFixed(2)}×`;

        zoomOut.disabled =
            zoom <= state.minZoom;

        zoomIn.disabled =
            zoom >= state.maxZoom;
    }

    function getPointerPosition(event) {
        const rect =
            cropArea.getBoundingClientRect();

        return {
            x: clamp(
                (event.clientX - rect.left) /
                    rect.width,
                0,
                1
            ),

            y: clamp(
                (event.clientY - rect.top) /
                    rect.height,
                0,
                1
            )
        };
    }

    function distance(a, b) {
        return Math.hypot(
            a.clientX - b.clientX,
            a.clientY - b.clientY
        );
    }

    function midpoint(a, b) {
        return {
            x:
                (a.clientX + b.clientX) /
                2,

            y:
                (a.clientY + b.clientY) /
                2
        };
    }

    function getTwoPointers() {
        return Array.from(
            state.pointers.values()
        ).slice(0, 2);
    }

    function setFocusPoint(x, y) {
        state.focusX = x;
        state.focusY = y;

        focusPoint.style.left =
            `${x * 100}%`;

        focusPoint.style.top =
            `${y * 100}%`;

        focusPoint.style.display =
            "block";
    }

    function centerOnPoint(x, y) {
        /*
         * Clicking a point should move the
         * image so that the clicked point
         * ends up in the center.
         */
        state.x = x;
        state.y = y;

        setFocusPoint(
            x,
            y
        );

        render();
    }

    function zoomAround(
        newZoom,
        centerX,
        centerY
    ) {
        const oldZoom =
            state.zoom;

        newZoom =
            clamp(
                newZoom,
                state.minZoom,
                state.maxZoom
            );

        if (
            newZoom === oldZoom
        ) {
            return;
        }

        /*
         * Preserve the image point underneath
         * the cursor/fingers as much as possible
         * while changing zoom.
         */
        const ratio =
            1 -
            oldZoom /
            newZoom;

        state.x +=
            (centerX - 0.5) *
            ratio;

        state.y +=
            (centerY - 0.5) *
            ratio;

        state.zoom =
            newZoom;

        updateBounds();
        render();
    }

    function reset() {
        state.x = 0.5;
        state.y = 0.5;
        state.zoom = 1;

        focusPoint.style.display =
            "none";

        render();
    }

    function startDrag(event) {
        state.dragging =
            true;

        state.dragStartX =
            event.clientX;

        state.dragStartY =
            event.clientY;

        state.dragOriginX =
            state.x;

        state.dragOriginY =
            state.y;
    }

    function drag(event) {
        if (!state.dragging) {
            return;
        }

        const rect =
            cropArea.getBoundingClientRect();

        const dx =
            event.clientX -
            state.dragStartX;

        const dy =
            event.clientY -
            state.dragStartY;

        /*
         * Dragging the image moves the crop
         * in the opposite direction.
         */
        state.x =
            state.dragOriginX -
            dx / rect.width;

        state.y =
            state.dragOriginY -
            dy / rect.height;

        updateBounds();
        render();
    }

    function endDrag() {
        state.dragging =
            false;
    }

    cropArea.addEventListener(
        "pointerdown",
        event => {
            cropArea.setPointerCapture(
                event.pointerId
            );

            state.pointers.set(
                event.pointerId,
                event
            );

            if (
                state.pointers.size === 1
            ) {
                startDrag(event);
            }

            if (
                state.pointers.size === 2
            ) {
                const [
                    a,
                    b
                ] =
                    getTwoPointers();

                state.pinchDistance =
                    distance(a, b);

                state.pinchZoom =
                    state.zoom;

                const mid =
                    midpoint(a, b);

                const rect =
                    cropArea.getBoundingClientRect();

                state.pinchCenterX =
                    clamp(
                        (mid.x - rect.left) /
                            rect.width,
                        0,
                        1
                    );

                state.pinchCenterY =
                    clamp(
                        (mid.y - rect.top) /
                            rect.height,
                        0,
                        1
                    );

                state.dragging =
                    false;
            }

            event.preventDefault();
        },
        {
            passive: false
        }
    );

    cropArea.addEventListener(
        "pointermove",
        event => {
            if (
                !state.pointers.has(
                    event.pointerId
                )
            ) {
                return;
            }

            state.pointers.set(
                event.pointerId,
                event
            );

            if (
                state.pointers.size === 1
            ) {
                drag(event);
            }

            if (
                state.pointers.size === 2
            ) {
                const [
                    a,
                    b
                ] =
                    getTwoPointers();

                const currentDistance =
                    distance(a, b);

                if (
                    state.pinchDistance > 0
                ) {
                    const ratio =
                        currentDistance /
                        state.pinchDistance;

                    zoomAround(
                        state.pinchZoom *
                            ratio,

                        state.pinchCenterX,
                        state.pinchCenterY
                    );
                }
            }

            event.preventDefault();
        },
        {
            passive: false
        }
    );

    cropArea.addEventListener(
        "pointerup",
        event => {
            state.pointers.delete(
                event.pointerId
            );

            if (
                state.pointers.size === 0
            ) {
                endDrag();
            }

            if (
                state.pointers.size === 1
            ) {
                const remaining =
                    Array.from(
                        state.pointers.values()
                    )[0];

                startDrag(
                    remaining
                );
            }
        }
    );

    cropArea.addEventListener(
        "pointercancel",
        event => {
            state.pointers.delete(
                event.pointerId
            );

            if (
                state.pointers.size === 0
            ) {
                endDrag();
            }
        }
    );

    cropArea.addEventListener(
        "wheel",
        event => {
            event.preventDefault();

            const position =
                getPointerPosition(
                    event
                );

            const amount =
                event.deltaY < 0
                    ? state.zoomStep
                    : -state.zoomStep;

            zoomAround(
                state.zoom + amount,
                position.x,
                position.y
            );

            setFocusPoint(
                position.x,
                position.y
            );
        },
        {
            passive: false
        }
    );

    zoomOut.addEventListener(
        "click",
        () => {
            zoomAround(
                state.zoom -
                    state.zoomStep,
                0.5,
                0.5
            );
        }
    );

    zoomIn.addEventListener(
        "click",
        () => {
            zoomAround(
                state.zoom +
                    state.zoomStep,
                0.5,
                0.5
            );
        }
    );

    resetButton.addEventListener(
        "click",
        reset
    );

    /*
     * A short click without meaningful
     * movement acts as "center here".
     */
    let clickStart = null;

    cropArea.addEventListener(
        "pointerdown",
        event => {
            if (
                state.pointers.size !== 1
            ) {
                return;
            }

            clickStart = {
                x: event.clientX,
                y: event.clientY
            };
        }
    );

    cropArea.addEventListener(
        "pointerup",
        event => {
            if (!clickStart) {
                return;
            }

            const dx =
                event.clientX -
                clickStart.x;

            const dy =
                event.clientY -
                clickStart.y;

            const moved =
                Math.hypot(dx, dy);

            clickStart = null;

            if (moved > 8) {
                return;
            }

            const position =
                getPointerPosition(
                    event
                );

            centerOnPoint(
                position.x,
                position.y
            );
        }
    );

    function getPayload() {
        return {
            type: "set_photo",

            session,

            crop: {
                x: Number(
                    state.x.toFixed(6)
                ),

                y: Number(
                    state.y.toFixed(6)
                ),

                zoom: Number(
                    state.zoom.toFixed(4)
                )
            },

            telegram: tg
                ? {
                    initData:
                        tg.initData || "",

                    version:
                        tg.version || "",

                    platform:
                        tg.platform || ""
                }
                : null
        };
    }

    async function submit() {
        if (!session) {
            showError(
                "This crop session is missing."
            );
            return;
        }

        submitButton.disabled =
            true;

        cancelButton.disabled =
            true;

        setStatus(
            "Applying profile photo..."
        );

        try {
            /*
             * This endpoint will be implemented
             * in the Cloudflare Worker.
             */
            const response =
                await fetch(
                    "/api/crop",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                getPayload()
                            )
                    }
                );

            const result =
                await response.json();

            if (
                !response.ok ||
                !result.success
            ) {
                throw new Error(
                    result.error ||
                    "The profile photo could not be changed."
                );
            }

            setStatus(
                "Profile photo changed."
            );

            /*
             * Give the Worker a moment to finish
             * the Telegram operation, then close.
             */
            if (tg) {
                setTimeout(
                    () => tg.close(),
                    500
                );
            }

        } catch (error) {
            console.error(
                error
            );

            showError(
                error.message ||
                "Something went wrong."
            );

            submitButton.disabled =
                false;

            cancelButton.disabled =
                false;
        }
    }

    async function cancel() {
        if (session) {
            try {
                await fetch(
                    "/api/crop/cancel",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                session,

                                telegram: tg
                                    ? {
                                        initData:
                                            tg.initData ||
                                            ""
                                    }
                                    : null
                            })
                    }
                );
            } catch (error) {
                console.error(
                    error
                );
            }
        }

        if (tg) {
            tg.close();
        }
    }

    submitButton.addEventListener(
        "click",
        submit
    );

    cancelButton.addEventListener(
        "click",
        cancel
    );

    /*
     * Load the image from the Worker.
     *
     * The Worker will later expose:
     *
     * GET /api/crop/image?session=...
     */
    async function loadImage() {
        if (!session) {
            showError(
                "No crop session was supplied."
            );
            return;
        }

        try {
            const response =
                await fetch(
                    `/api/crop/image?session=${encodeURIComponent(session)}`
                );

            if (!response.ok) {
                throw new Error(
                    "The image could not be loaded."
                );
            }

            const blob =
                await response.blob();

            const objectUrl =
                URL.createObjectURL(
                    blob
                );

            image.onload = () => {
                state.imageWidth =
                    image.naturalWidth;

                state.imageHeight =
                    image.naturalHeight;

                reset();

                setStatus(
                    "Adjust the crop."
                );
            };

            image.src =
                objectUrl;

        } catch (error) {
            console.error(
                error
            );

            showError(
                error.message ||
                "The image could not be loaded."
            );
        }
    }

    loadImage();
})();
</script>

</body>
</html>
