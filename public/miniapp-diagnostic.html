<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>
<title>Mini App Diagnostic</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    padding: 16px;
}

h1 {
    font-size: 22px;
    margin: 0 0 16px;
}

.section {
    margin-bottom: 16px;
    padding: 12px;
    border-radius: 12px;
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
}

.label {
    font-size: 12px;
    opacity: 0.65;
    margin-bottom: 4px;
}

.value {
    word-break: break-word;
    white-space: pre-wrap;
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;
    font-size: 13px;
}

.ok {
    color: #16803c;
}

.warning {
    color: #b36b00;
}

pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 11px;
}
</style>
</head>

<body>

<h1>Mini App Diagnostic</h1>

<div class="section">
    <div class="label">Telegram WebApp version</div>
    <div class="value" id="version"></div>
</div>

<div class="section">
    <div class="label">Platform</div>
    <div class="value" id="platform"></div>
</div>

<div class="section">
    <div class="label">User</div>
    <div class="value" id="user"></div>
</div>

<div class="section">
    <div class="label">Chat</div>
    <div class="value" id="chat"></div>
</div>

<div class="section">
    <div class="label">Start parameter</div>
    <div class="value" id="startParam"></div>
</div>

<div class="section">
    <div class="label">Query ID</div>
    <div class="value" id="queryId"></div>
</div>

<div class="section">
    <div class="label">Auth date</div>
    <div class="value" id="authDate"></div>
</div>

<div class="section">
    <div class="label">Raw initDataUnsafe</div>
    <pre id="raw"></pre>
</div>

<script>
const webApp =
    window.Telegram?.WebApp;

if (!webApp) {
    document.body.innerHTML =
        "<h1>Telegram WebApp API not available</h1>";
} else {
    webApp.ready();
    webApp.expand();

    const data =
        webApp.initDataUnsafe || {};

    const user =
        data.user || null;

    const chat =
        data.chat || null;

    document.getElementById(
        "version"
    ).textContent =
        webApp.version || "(none)";

    document.getElementById(
        "platform"
    ).textContent =
        webApp.platform || "(none)";

    document.getElementById(
        "user"
    ).textContent =
        user
            ? JSON.stringify(
                user,
                null,
                2
            )
            : "(no user)";

    document.getElementById(
        "chat"
    ).textContent =
        chat
            ? JSON.stringify(
                chat,
                null,
                2
            )
            : "(no chat object)";

    document.getElementById(
        "startParam"
    ).textContent =
        data.start_param ||
        "(none)";

    document.getElementById(
        "queryId"
    ).textContent =
        data.query_id ||
        "(none)";

    let authDate =
        data.auth_date;

    if (authDate) {
        authDate =
            `${authDate} (${new Date(
                Number(authDate) * 1000
            ).toLocaleString()})`;
    } else {
        authDate = "(none)";
    }

    document.getElementById(
        "authDate"
    ).textContent =
        authDate;

    document.getElementById(
        "raw"
    ).textContent =
        JSON.stringify(
            data,
            null,
            2
        );
}
</script>

</body>
</html>
